spring.config.import=optional:classpath:secretos.properties

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://localhost:3306/colores_prueba?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect.mysql.storage_engine=innodb

spring.jackson.deserialization.accept-empty-string-as-null-object=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.auth=true
app.mail.remitente=${MAIL_FROM:${spring.mail.username}}

app.cors.origenes=${APP_CORS_ORIGENES:*}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

usig.base-url=${USIG_BASE_URL:https://ws.usig.buenosaires.gob.ar}

admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}

mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.notification-url=${MP_NOTIFICATION_URL:}

pedidos.minutos-para-pagar=${PEDIDOS_MINUTOS_PARA_PAGAR:20}
